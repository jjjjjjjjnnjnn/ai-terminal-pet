name: CI

# This is the only workflow in the repository. It answers one question on every
# push and pull request: does a clean checkout still build, test and load every
# reporter on a stock Windows runner? Nothing here needs a desktop session or a
# secret, because the live-desktop probes are opt-in tests that Skip when their
# PET_* variable is unset (see the comment block further down).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete. Cancelling it
# frees the (limited) Windows runner pool instead of queueing old commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # tools/upstream-entry.mjs --check asks whether a bump pull request is already
  # open in the catalogue repository, so it needs to read pull requests on
  # github.com with the run's token. Nothing here writes anything.
  pull-requests: read

# Every action here is on a major that declares `using: node24`. The previous
# majors (checkout@v4, setup-go@v5, setup-node@v4, setup-python@v5,
# upload-artifact@v4) are node20 and GitHub annotates every run telling us they
# are being force-run on node24 - a deprecation notice that will eventually
# become a failure. Verified before bumping, not assumed: each action's own
# action.yml was read for both the runtime line and the inputs this workflow
# passes (checkout: fetch-depth, setup-go: go-version-file/cache, setup-node:
# node-version, setup-python: python-version, upload-artifact:
# path/if-no-files-found/retention-days). upload-artifact is why v6 exists at
# all - v5 is still node20 - and v7 is used to keep one major line.

jobs:
  verify:
    name: build and verify
    runs-on: windows-latest
    timeout-minutes: 20

    # The repository is UTF-8 with LF, and .gitattributes pins "* text=auto eol=lf",
    # so this checkout is LF even though the Windows runner image sets
    # core.autocrlf=true. Without that attribute the tree here would differ from
    # what developers run locally and gofmt/git diffs would disagree with them.
    env:
      GOFLAGS: -mod=readonly
      GO111MODULE: on

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gofmt and go vet only need the tree; no history, no tags.
          fetch-depth: 1

      # go-version-file instead of a hard-coded "1.23.x": go.mod's "go 1.23.0"
      # line is the single place the toolchain requirement is declared, and a
      # dependency bumping it (e.g. to 1.24) must move CI in the same commit.
      # setup-go still installs the newest 1.23 patch release, never a preview.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Node 22 rather than 20: the reporters and the Harness plugin are plain
      # JavaScript with no dependencies, and 22 is the current LTS line. No
      # "cache: npm" here on purpose - there is no lockfile to key it on (the
      # Node artifacts in this repository are dependency-free).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Only for tools/check_docs_links.py, which is stdlib-only. Pinning the
      # interpreter is cheaper than discovering that the runner image's Python
      # moved a version and the script's f-strings changed behaviour.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Show toolchain versions
        shell: bash
        run: |
          go version
          node --version

      # gofmt -l prints one path per file that is not formatted. Any output at
      # all fails the build: a formatting nit is cheapest to fix in the PR that
      # introduced it. bash is used instead of the default pwsh so the exit-code
      # handling is identical on every runner image.
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt: these files are not formatted (run gofmt -w <file>):"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a run always really executes
      # the tests. The opt-in probes in internal/ui and internal/platform call
      # t.Skip when PET_PREVIEW_DIR / PET_SOUND_PROBE / PET_FOCUS_PROBE /
      # PET_DSH_PROBE / PET_PRESENCE_PROBE is unset, so a headless runner Skips
      # them instead of failing on a missing window.
      - name: go test
        run: go test -count=1 ./...

      # -trimpath keeps absolute build paths out of the binary, and -s -w strips
      # the symbol/DWARF tables: these are distributed small and the crash log
      # rotation in cmd/ai-terminal-pet does not need a symbol server.
      - name: Build the overlay
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o ./bin/AI-Terminal-Pet.exe ./cmd/ai-terminal-pet

      - name: Build the statusline shim
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o ./bin/pet-statusline.exe ./cmd/pet-statusline

      # The native hook is what a Claude Code or Antigravity user runs on every
      # event, so a broken build is a broken host CLI. It shares internal/reporter
      # with the statusline shim, which is why that package is tested as Go code
      # rather than compared to the JavaScript reporters by eye.
      - name: Build the hook binary
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o ./bin/pet-hook.exe ./cmd/pet-hook

      # The single-file installer builds from a checkout with a placeholder
      # payload, on purpose: `go build ./cmd/pet-setup` must work here and the
      # binary must refuse to install anything. `go test ./...` covers the
      # refusal; this step covers the compile, because a payload stub that stops
      # embedding is a packaging failure nobody notices until the day it ships.
      - name: Build the setup stub
        run: go build -trimpath -buildvcs=false -ldflags "-s -w" -o ./bin/pet-setup.exe ./cmd/pet-setup

      # node --check parses without executing. Every reporter under reporters/
      # must stay loadable in the Node version the runner ships, because a
      # syntax error there breaks the host CLI hook, not just this repository.
      #
      # The loop is not decoration: "node --check a.js b.js" checks ONLY the
      # first argument and exits 0 even when the second file is broken (verified
      # on Node 24: broken.js as the 2nd argument -> exit 0). A bare
      # "node --check reporters/*.js" would therefore only ever guard the
      # alphabetically first file. Checking each file in turn is the only form
      # that actually covers all of them.
      #
      # opencode.js is ESM with no "type" in reporters/package.json, so Node
      # detects the module syntax on parse. That detection is a default since
      # Node 22.7.0, which is why the runner pins the 22 line rather than 20.
      - name: Check reporter syntax
        shell: bash
        run: |
          for file in reporters/*.js; do
            node --check "$file"
            echo "node --check: $file OK"
          done

      # The OpenCode event mapping is a pure function, so it is tested directly
      # instead of by eye. Two shipped bugs came out of this table: a substring
      # matcher turned tui.prompt.append - fired when the user types or pastes an
      # ordinary command - into waiting_permission, so the overlay rang for
      # nothing, and the events that do carry a real ask (permission.asked) and
      # real work (session.tool.called, session.execution.*) were not mapped at
      # all under their 2.2.7 names.
      - name: Test the OpenCode event mapping
        run: node --test reporters/opencode-events.test.mjs

      # verify.mjs loads the Harness bundle the way the Harness loader does and
      # fails on an unloadable manifest, a missing locale or a broken patch.
      - name: Verify the DeepSeek Harness bundle
        run: node integrations/deepseek-harness/verify.mjs

      # The DSH plugin package ships a vendored copy of the overlay binary, because
      # a marketplace install has no Go toolchain to build one. A stale vendor copy
      # would silently ship an old overlay to every installer, so this step fails
      # here instead.
      #
      # It cannot be a byte comparison against this checkout's bin/: go.mod's
      # `go 1.23.0` is a floor, not a pin, so this runner builds with go1.23.0 while
      # the committed overlay was built with a newer local Go, and different
      # releases compile identical sources to different bytes. The guard is
      # vendor/manifest.json's source digest: one sha256 over every *.go file the
      # committed binary was built from. If a source changed without re-vendoring,
      # the digest no longer matches and this step exits 2. The raw byte
      # comparison still runs, but only when the manifest names the same Go
      # release as this runner.
      #
      # The digest deliberately skips the packages the overlay does not link
      # (cmd/pet-hook, cmd/pet-statusline and internal/reporter today): an edit to
      # a binary the overlay never imports cannot change one byte of it, so it
      # must not force a re-vendor of the released package's manifest.
      - name: Check the vendored overlay is current
        run: node packages/dsh-ai-terminal-pet/scripts/vendor.mjs --check

      # verify.mjs drives the plugin with a fake Cordis context, a temporary
      # LOCALAPPDATA and a stub protocol module: state mapping, the approval
      # waterfall, dispose-versus-exit, the bootstrap copy rules and the
      # repository-root shim manifest. No network, no named pipe, no overlay.
      - name: Verify the DSH plugin package
        run: node packages/dsh-ai-terminal-pet/verify.mjs

      # The fresh-machine suite is the only gate that exercises the paths a new
      # user actually walks: pack the package, extract it into a DSH-style
      # node_modules, load it with a fake Cordis context, then install with
      # install.ps1 and drive the three binaries - all inside a sandbox with its
      # own LOCALAPPDATA, USERPROFILE and pipe. --no-overlay skips the two
      # scenarios that spawn a window, which a headless runner should not do.
      # It needs the three binaries, so it runs after the build steps.
      #
      # It also asserts the documented entry point is scripts\install.cmd, not a
      # bare install.ps1: a stock Windows install runs PowerShell at RemoteSigned,
      # which refuses a .ps1 that still carries the "downloaded from the internet"
      # zone marker - the exact shape of a file a user unzips from a release.
      - name: Fresh-machine end-to-end suite
        run: node tests/fresh-machine.mjs --no-overlay

      # Does the catalogue entry in awesome-dsh-plugin point at the release this
      # package version names? That repository is where every storefront gets its
      # install command from, and each release has to move one line there by
      # hand. `--check` reads two hosts and one pull-request list, and its three
      # outcomes are deliberate: OK (listed), OK when a bump PR is open (the
      # entry only moves when a maintainer merges), and red only when nobody has
      # opened one at all. Unreleased versions, missing tokens and network
      # failures SKIP rather than pass. Rules and the rebuild tool:
      # docs/UPSTREAM.md.
      - name: Upstream catalogue entry
        run: node tools/upstream-entry.mjs --check

      # The rules behind the check above, pinned as unit tests: the entry file
      # name, the tarball URL shape, and the four refusals that keep a rebuild
      # from carrying somebody else's edit into a maintainer's review.
      - name: Upstream entry rules
        run: node --test tools/upstream-entry.test.mjs

      # Every relative link and in-document anchor in the docs we wrote. GitHub
      # renders a broken one without a warning, and a launch post is the worst
      # possible time to discover that "see the connect table" points at a
      # heading that was renamed. Cheap, deterministic, no dependencies.
      - name: Check documentation links
        run: python tools/check_docs_links.py

      # The portable zip and the self-extracting setup exe are what a Windows
      # user who does not use the DeepSeek Harness actually downloads, so a
      # packaging script that cannot produce them is a broken release, not a
      # broken build. This step stages the payload, builds pet-setup.exe around
      # it, then removes the staged files again (nothing 5 MB stays untracked).
      #
      # The overlay/vendor cross-check inside package.ps1 is why this is safe to
      # run here: it compares bin\AI-Terminal-Pet.exe against the committed
      # vendor copy and refuses when they diverge. On this runner they always
      # diverge - `go 1.23.0` in go.mod is a floor, so the runner compiles with
      # go1.23.0 while the committed vendor binary was built with a newer local
      # Go, and different releases produce different bytes from identical
      # sources. The cross-check is therefore skipped here and left to the
      # machine that cuts the release, which is the only one that can be right.
      - name: Package the portable zip and the setup exe
        shell: pwsh
        run: ./scripts/package.ps1
        env:
          PET_PACKAGE_SKIP_VENDOR_CHECK: '1'

      - name: Upload the portable zip and the setup exe
        uses: actions/upload-artifact@v7
        with:
          name: ai-terminal-pet-win-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  # The two scanners live in their own job for one concrete reason: both
  # `golang.org/x/vuln@v1.9.0` and `gosec@v2.30.0` declare `go 1.26.0` in their
  # own go.mod, while the build job installs the newest 1.23.x patch because
  # setup-go reads this repository's go.mod floor. Running them next to the
  # build would make Go switch toolchains implicitly (GOTOOLCHAIN=auto downloads
  # a whole second Go - minutes of runner time, and one more way to go red) or
  # refuse outright. Keeping the build job on 1.23 exactly preserves the point
  # that "the same source builds the same bytes"; the scanners get a toolchain
  # that matches what they ask for.
  #
  # Neither scanner needs gcc/cgo, which is why they can run at all here -
  # `go test -race` does need them on Windows and stays a documented gap
  # (docs/ROADMAP.md §6).
  scan:
    name: vulnerability and static analysis
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 'stable' rather than a pinned minor, and this is the one place a
      # toolchain is deliberately NOT pinned: the scanners' own `go` floor moves
      # forward (1.26 today), so a pinned minor would eventually refuse to build
      # them and the failure would say nothing about this repository's code.
      # This job only ever runs the scanners - the build, the tests and the
      # binaries stay on go.mod's floor in `verify` - so floating here cannot
      # change a shipped byte. The scanner versions below are the thing that is
      # pinned, and moving them is a deliberate commit.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Show toolchain versions
        shell: bash
        run: go version

      # govulncheck answers the question that matters for a distributed binary:
      # does any *called* function have a known vulnerability? It reports zero
      # today, while listing 14 module-level advisories this code cannot reach.
      # The vulnerability database is fetched over the network, so this is the
      # one step in CI that can fail for a reason outside the repository -
      # re-run before believing a red result here.
      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # gosec is gated at high severity AND high confidence on purpose. Every
      # lower threshold flags things this code does on purpose:
      #   G115 (84 hits) - integer conversions between uintptr/uint32 in the
      #     Win32 message plumbing and lParam extraction; those values are
      #     pointer and message payloads, not arithmetic. Excluded as a rule
      #     family, because every hit is that pattern.
      #   G703 (12 hits, 4 files) - file paths built from %LOCALAPPDATA% through
      #     filepath.Join; the trust boundary is "the user's own profile".
      #     Excluded BY PATH on exactly those four files, not as a rule family:
      #     a taint finding anywhere else - a new reporter, a new pipe handler,
      #     a path that arrives from the wire - still fails this job. Verified
      #     both ways: the four-file rule suppresses all 12, and removing one
      #     file from the pattern lets 7 through.
      # Neither exclusion is a per-line `#nosec` annotation: that would edit the
      # overlay's Go sources, change vendor/manifest.json's source digest, and
      # force a re-vendor - hence a new plugin version - for a zero-behaviour
      # change. The reasons live here so a future reviewer can re-judge them.
      - name: Static analysis (gosec)
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          -severity high -confidence high -exclude G115
          -exclude-rules "(cmd/ai-terminal-pet/main|internal/app/app_windows|internal/ui/app_windows|internal/reporter/approval)\.go:G703"
          ./...
